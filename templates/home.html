<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth0 Login Flow Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23eb5424'/></svg>">
  <style>
    body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 48px; max-width: 460px; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #8b949e; margin: 0 0 28px; }
    .btn { display: inline-block; background: #eb5424; color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 16px; }
    .btn:hover { background: #d64a1e; }
    .badge { display: inline-block; font-size: 12px; letter-spacing: 1px; color: #eb5424; border: 1px solid #eb5424; border-radius: 999px; padding: 4px 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">MLH BUILDERS WEEK</span>
    <h1>Welcome</h1>
    <p>A minimal Flask app wired for an end-to-end Auth0 OpenID Connect login flow.</p>
    {% if user %}
      <a class="btn" href="/dashboard">Go to dashboard</a>
    {% else %}
      <a class="btn" href="/login">Log in with Auth0</a>
    {% endif %}
  </div>
</body>
</html>
